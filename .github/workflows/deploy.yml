name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type and content checks
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Check internal links
        run: pnpm check:links

      # Its first check scans dist/ for i18n keys that leaked into the page, so it runs after Build.
      - name: Check terminology and content integrity
        run: pnpm check:terms

      # Reads computed colours from dist/ in headless Chrome, which the runner image ships.
      - name: Check contrast
        run: pnpm check:contrast

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages with GitHub Actions as the source on the first run.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
